[project]
name = "soma-client"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "eclipse-zenoh==1.6.2",
  "protobuf>=6,<8",
  "mujoco==3.6.0",
  "numpy==2.3.5",
  "onnxruntime==1.24.4",
  "reachy-mini-rust-kinematics==1.0.3",
]

[project.optional-dependencies]
visualization = [
  "rerun-sdk==0.36.2",
  "rerun-loader-mjcf==1.0.1",
  "imageio-ffmpeg==0.6.0",
]

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.uv]
package = false
