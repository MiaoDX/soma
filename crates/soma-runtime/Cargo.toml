[package]
name = "soma-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
fs2 = "0.4"
libc = "0.2"
ndarray = "0.17.2"
ort = { version = "=2.0.0-rc.11", default-features = false, features = ["load-dynamic", "ndarray", "std"] }
prost = "0.14"
rerun = { version = "=0.36.2", default-features = false, features = ["sdk"], optional = true }
soma-core = { path = "../soma-core" }
soma-protocol = { path = "../soma-protocol" }
soma-sim = { path = "../soma-sim" }
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
zenoh = "=1.10.0"
sha2 = "0.10"

[features]
sim-visualization = ["dep:rerun", "soma-sim/viewer"]
sim-showcase = ["sim-visualization", "soma-sim/showcase"]

[[bin]]
name = "robot-rt"
path = "src/bin/robot-rt.rs"

[[bin]]
name = "robot-runtime"
path = "src/bin/robot-runtime.rs"

[[bin]]
name = "robot-sim-observer"
path = "src/bin/robot-sim-observer.rs"
required-features = ["sim-visualization"]

[[bin]]
name = "open-duck-runtime"
path = "src/bin/open-duck-runtime.rs"

[[bin]]
name = "open-duck-rt"
path = "src/bin/open-duck-rt.rs"

[[bin]]
name = "open-duck-policy"
path = "src/bin/open-duck-policy.rs"
