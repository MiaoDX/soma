[package]
name = "soma-probe"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
clap = { version = "4.5", features = ["derive"] }
rustypot = "=1.6.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = { version = "4.8", default-features = false }

[[bin]]
name = "soma-reachy-probe"
path = "src/main.rs"
